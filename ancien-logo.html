<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logo ZAF BAT</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: #f5f2ec;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .logo svg {
      width: 180px;
      height: 164px;
    }
  </style>
</head>
<body>
  <div class="logo">
    <svg viewBox="0 0 220 200" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="lgA" x1="50%" y1="0%" x2="50%" y2="100%">
          <stop offset="0%"   stop-color="#f0d890"/>
          <stop offset="45%"  stop-color="#D3A357"/>
          <stop offset="100%" stop-color="#9a7a48"/>
        </linearGradient>
        <linearGradient id="lgB" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%"   stop-color="#D3A357"/>
          <stop offset="100%" stop-color="#9a7a48"/>
        </linearGradient>
        <linearGradient id="lgC" x1="100%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%"   stop-color="#D3A357"/>
          <stop offset="100%" stop-color="#9a7a48"/>
        </linearGradient>
      </defs>
      <rect x="32"  y="82" width="18" height="96" fill="url(#lgB)" opacity="0.9"/>
      <rect x="170" y="82" width="18" height="96" fill="url(#lgC)" opacity="0.9"/>
      <path d="M 32,88 Q 32,24 110,24 Q 188,24 188,88" fill="none" stroke="url(#lgA)" stroke-width="18" opacity="0.95"/>
      <polygon points="110,12 120,30 100,30" fill="url(#lgA)" opacity="0.98"/>
    </svg>
  </div>
</body>
</html>
