<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZAF BAT — Logo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: #f5f2ec;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .logo svg {
      width: 200px;
      height: 182px;
      filter: drop-shadow(0px 10px 20px rgba(154, 122, 72, 0.18));
      overflow: visible;
    }
  </style>
</head>
<body>
  <div class="logo">
    <svg viewBox="0 0 220 200" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Dégradé or (arche + piliers) -->
        <linearGradient id="lgA" x1="50%" y1="0%" x2="50%" y2="100%">
          <stop offset="0%"   stop-color="#f0d890"/>
          <stop offset="45%"  stop-color="#D3A357"/>
          <stop offset="100%" stop-color="#9a7a48"/>
        </linearGradient>

        <!-- Dégradés émeraude (haute joaillerie, ton profond mais vivant) -->
        <linearGradient id="emTL" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%"   stop-color="#2E6A4F"/>
          <stop offset="100%" stop-color="#153C2A"/>
        </linearGradient>
        <linearGradient id="emTR" x1="100%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%"   stop-color="#3E8A67"/>
          <stop offset="100%" stop-color="#1D4C37"/>
        </linearGradient>
        <linearGradient id="emBL" x1="0%" y1="100%" x2="100%" y2="0%">
          <stop offset="0%"   stop-color="#0A1E12"/>
          <stop offset="100%" stop-color="#1A3F28"/>
        </linearGradient>
        <linearGradient id="emBR" x1="100%" y1="100%" x2="0%" y2="0%">
          <stop offset="0%"   stop-color="#163D28"/>
          <stop offset="100%" stop-color="#255237"/>
        </linearGradient>
      </defs>

      <!-- Silhouette or unifiée (piliers + connecteurs + arche) -->
      <path
        fill="url(#lgA)"
        fill-rule="evenodd"
        d="
          M 45,178
          L 45,89.5
          Q 45,92 42.5,92
          L 30.5,92
          Q 28,92 28,89.5
          L 28,84
          Q 28,11 110,11
          Q 192,11 192,84
          L 192,89.5
          Q 192,92 189.5,92
          L 177.5,92
          Q 175,92 175,89.5
          L 175,178
          Z

          M 63,178
          L 63,86.5
          Q 63,84 60.5,84
          L 48.5,84
          Q 46,84 46,81.5
          Q 46,29 110,29
          Q 174,29 174,81.5
          Q 174,84 171.5,84
          L 159.5,84
          Q 157,84 157,86.5
          L 157,178
          Z
        "/>

      <!--
        ♦ Sertissage creusé : un losange couleur fond est découpé dans l'or,
        légèrement plus grand que la gemme. Il ne la touche pas → effet
        "pierre sertie dans l'arche, avec un jeu de lumière autour".
      -->
      <polygon points="110,-2 126,20 110,42 94,20" fill="#f5f2ec"/>

      <!--
        ♦ Diamant émeraude sombre, taillé en 4 facettes.
        Centré à (110, 20). La gemme flotte dans le sertissage sans le toucher.
      -->
      <g>
        <!-- Facette haut-gauche -->
        <polygon points="110,2 110,20 98,20"  fill="url(#emTL)"/>
        <!-- Facette haut-droite (highlight) -->
        <polygon points="110,2 122,20 110,20" fill="url(#emTR)"/>
        <!-- Facette bas-gauche (ombre la plus profonde) -->
        <polygon points="110,38 98,20 110,20" fill="url(#emBL)"/>
        <!-- Facette bas-droite -->
        <polygon points="110,38 122,20 110,20" fill="url(#emBR)"/>
        <!-- Contour fin pour définir la gemme -->
        <polygon points="110,2 122,20 110,38 98,20"
                 fill="none" stroke="#030F08" stroke-width="0.7"/>
        <!-- Petit éclat subtil sur la facette supérieure droite -->
        <polygon points="114,7 118,14 114,12" fill="#B8D9C2" opacity="0.45"/>
      </g>
    </svg>
  </div>
</body>
</html>
